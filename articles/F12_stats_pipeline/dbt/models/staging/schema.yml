version: 2
models:
  - name: stg_cpi
    description: 消費者物価指数（2020年=100）
    columns:
      - name: month
        tests: [unique, not_null]
      - name: cpi_all
        tests:
          - not_null
          - value_between:
              arguments: {min_value: 10, max_value: 200}
  - name: stg_lfs
    columns:
      - name: month
        tests: [unique, not_null]
      - name: unemp_rate_sa
        tests:
          - not_null
          - value_between:
              arguments: {min_value: 0, max_value: 15}
  - name: stg_jobs
    columns:
      - name: month
        tests: [unique, not_null]
      - name: jobs_ratio_sa
        tests:
          - value_between:
              arguments: {min_value: 0.1, max_value: 3}
  - name: stg_wage
    columns:
      - name: month
        tests: [unique, not_null]
      - name: real_wage_total_yoy
        tests:
          - value_between:
              arguments: {min_value: -20, max_value: 20}
