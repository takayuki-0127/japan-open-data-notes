name: reproduce

on:
  schedule:
    - cron: "17 18 * * 0"   # 毎週月曜 3:17（日本時間）
  workflow_dispatch:
    inputs:
      chunk:
        description: "0〜4 の番号（空なら週の番号で選ぶ）"
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -r tools/requirements-ci.txt
      - name: pytest（代表的な短い記事）
        run: pytest -q tests
      - name: 記事の一覧の5分の1を流し直す
        run: python tools/repro_check.py --chunk "${{ github.event.inputs.chunk || 'auto' }}" --n-chunks 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro_result
          path: repro_result.json
